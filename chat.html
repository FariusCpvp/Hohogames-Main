<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eeeeee">
    <title>Community Chat | Farius</title>
    <link rel="icon" type="image/png" href="png/logo.png">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="page-brand" aria-label="Farius">
        <a class="pressable" href="index.html">Farius</a>
        <span>Made by Hohogames</span>
    </div>

    <nav class="side-panel" aria-label="Main navigation">
        <a class="pressable" href="index.html" title="Home" aria-label="Home">
            <img src="png/house-solid.svg" alt="">
        </a>
        <a class="pressable" href="games.html" title="Games" aria-label="Games">
            <img src="png/gamepad-solid.svg" alt="">
        </a>
        <a class="pressable" href="settings.html" title="Settings" aria-label="Settings">
            <img src="png/gear-solid.svg" alt="">
        </a>
    </nav>

    <main class="chat-shell">
        <header class="chat-header">
            <div class="heading">
                <span class="eyebrow">Farius community</span>
                <h1>Community chat</h1>
                <p><span class="online-dot" aria-hidden="true"></span><span id="online-count">0</span> people online</p>
            </div>
            <a class="back-link pressable" href="index.html">Back home <span aria-hidden="true">↗</span></a>
        </header>

        <section class="chat-panel" aria-label="Community chat">
            <div class="panel-topline">
                <span>Live conversation</span>
                <span id="connection-state" class="connection-state">Connecting</span>
            </div>
            <ol id="messages" class="messages" aria-live="polite"></ol>
            <p id="status" class="status">Connecting to chat...</p>
            <form id="chat-form" class="chat-form">
                <label class="sr-only" for="message-input">Message</label>
                <input id="message-input" maxlength="500" autocomplete="off" placeholder="Write a message..." disabled>
                <button class="pressable" type="submit" disabled>Send <span aria-hidden="true">↗</span></button>
            </form>
        </section>
    </main>

    <dialog id="name-dialog" open>
        <form id="name-form" method="dialog" class="name-card">
            <div class="dialog-mark">F</div>
            <span class="eyebrow">Welcome to Farius</span>
            <h2>Join the conversation</h2>
            <p>Choose a display name to start chatting with the community.</p>
            <label for="name-input">Display name</label>
            <input id="name-input" maxlength="24" required autocomplete="nickname" placeholder="Guest">
            <button class="pressable" type="submit">Enter chat <span aria-hidden="true">↗</span></button>
        </form>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>

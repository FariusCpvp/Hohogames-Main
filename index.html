<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="png/logo.png">

    <title>Truffled</title>

    <link rel="stylesheet" href="/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #020202;
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -5;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(255,255,255,0.055),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(255,255,255,0.035),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,255,255,0.03),
                    transparent 25%
                ),
                #020202;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -4;

            background:
                linear-gradient(
                    rgba(255,255,255,0.012) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.012) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;
            mask-image: radial-gradient(circle, black, transparent 85%);
        }

        /* =========================================
           PARTICLE SYSTEM
        ========================================= */

        #particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            background: rgba(255,255,255,0.9);

            border-radius: 1px;

            box-shadow:
                0 0 7px rgba(255,255,255,0.45);

            opacity: 0;

            animation:
                paperFloat linear infinite,
                paperTwist ease-in-out infinite;
        }

        .particle.small {
            width: 3px;
            height: 3px;
        }

        .particle.large {
            width: 8px;
            height: 8px;
        }

        @keyframes paperFloat {
            0% {
                transform:
                    translate3d(0, 110vh, 0)
                    rotate(0deg);
                opacity: 0;
            }

            8% {
                opacity: 0.8;
            }

            50% {
                opacity: 0.65;
            }

            90% {
                opacity: 0.35;
            }

            100% {
                transform:
                    translate3d(120px, -15vh, 0)
                    rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes paperTwist {
            0% {
                margin-left: 0;
            }

            50% {
                margin-left: -40px;
            }

            100% {
                margin-left: 20px;
            }
        }

        /* =========================================
           LOADING SCREEN
        ========================================= */

        #loading-screen {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #000;

            z-index: 99999;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .dots {
            display: flex;
            gap: 9px;
            margin-bottom: 18px;
        }

        .dot {
            width: 9px;
            height: 9px;

            background: white;
            border-radius: 50%;

            animation: loadingBounce 0.9s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(255,255,255,0.7);
        }

        .dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes loadingBounce {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-12px);
                opacity: 1;
            }
        }

        #loading-text {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {
            position: fixed;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            width: min(94%, 1100px);
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 20px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 15px 50px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.06);

            z-index: 1000;

            animation: navbarDrop 0.9s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes navbarDrop {
            from {
                transform:
                    translate(-50%, -35px)
                    scale(0.95);

                opacity: 0;
            }

            to {
                transform:
                    translate(-50%, 0)
                    scale(1);

                opacity: 1;
            }
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 34px;
            height: 34px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 8px rgba(255,255,255,0.25));

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }

        .navbar-left:hover .logo {
            transform: rotate(-8deg) scale(1.12);

            filter:
                drop-shadow(0 0 16px rgba(255,255,255,0.6));
        }

        .logo-text {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;

            color: white;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .navbar-right a {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            border: 1px solid transparent;

            transition:
                transform 0.3s cubic-bezier(.2,.8,.2,1),
                background 0.3s ease,
                border 0.3s ease,
                box-shadow 0.3s ease;
        }

        .navbar-right a:hover {
            transform:
                translateY(-4px)
                scale(1.05);

            background: rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.14);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.45);
        }

        .navbar-right a:active {
            transform: scale(0.92);
        }

        .navbar-right img {
            width: 19px;
            height: 19px;

            object-fit: contain;

            filter:
                brightness(0)
                invert(1);

            opacity: 0.75;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .navbar-right a:hover img {
            opacity: 1;
            transform: scale(1.12);
        }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        .content {
            width: min(900px, 92%);

            min-height: 100vh;

            margin: 0 auto;

            padding-top: 235px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            animation: contentAppear 1.1s 0.2s both
                cubic-bezier(.2,.8,.2,1);
        }

        @keyframes contentAppear {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content h1 {
            font-size: clamp(42px, 7vw, 78px);

            line-height: 0.95;

            font-weight: 800;

            letter-spacing: -4px;

            margin-bottom: 22px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #ffffff 42%,
                    #8b8b8b 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 35px rgba(255,255,255,0.07);
        }

        .content > p {
            color: rgba(255,255,255,0.48);

            font-size: 15px;

            letter-spacing: 1.5px;

            margin-bottom: 42px;
        }

        /* =========================================
           SEARCH
        ========================================= */

        #uv-form {
            width: min(680px, 100%);

            position: relative;

            animation:
                searchAppear 1s 0.45s both
                cubic-bezier(.2,.8,.2,1);
        }

        @keyframes searchAppear {
            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        #uv-address {
            width: 100%;
            height: 67px;

            padding: 0 27px;

            border-radius: 21px;

            outline: none;

            border: 1px solid rgba(255,255,255,0.12);

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            font-family: inherit;
            font-size: 15px;

            transition:
                border 0.35s ease,
                box-shadow 0.35s ease,
                transform 0.35s ease,
                background 0.35s ease;
        }

        #uv-address::placeholder {
            color: rgba(255,255,255,0.38);
        }

        #uv-address:hover {
            border-color:
                rgba(255,255,255,0.2);

            background:
                rgba(255,255,255,0.055);
        }

        #uv-address:focus {
            border-color:
                rgba(255,255,255,0.38);

            background:
                rgba(255,255,255,0.065);

            transform:
                translateY(-2px);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.6),
                0 0 35px rgba(255,255,255,0.045),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Search shine */

        #uv-form::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 40%;
            height: 100%;

            border-radius: 21px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.08),
                    transparent
                );

            pointer-events: none;

            animation: searchShine 5s infinite;
        }

        @keyframes searchShine {
            0% {
                left: -100%;
            }

            30%,
            100% {
                left: 130%;
            }
        }

        /* =========================================
           ERROR
        ========================================= */

        .desc {
            width: min(680px, 100%);
            margin-top: 10px;

            text-align: left;
        }

        #uv-error {
            color: #ff6b6b;
            font-size: 13px;
        }

        #uv-error-code {
            color: #999;
            font-size: 11px;
            white-space: pre-wrap;
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .button-container {
            height: 20px;
        }

        .button,
        .sigma {
            border: 1px solid rgba(255,255,255,0.12);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.08),
                    rgba(255,255,255,0.025)
                );

            color: white;

            border-radius: 14px;

            padding: 12px 22px;

            margin: 6px;

            font-family: inherit;
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            backdrop-filter: blur(12px);

            transition:
                transform 0.35s cubic-bezier(.2,.8,.2,1),
                background 0.35s ease,
                border 0.35s ease,
                box-shadow 0.35s ease;
        }

        .button:hover,
        .sigma:hover {
            transform:
                translateY(-5px)
                scale(1.04);

            background:
                rgba(255,255,255,0.11);

            border-color:
                rgba(255,255,255,0.25);

            box-shadow:
                0 14px 35px rgba(0,0,0,0.45),
                0 0 20px rgba(255,255,255,0.05);
        }

        .button:active,
        .sigma:active {
            transform:
                translateY(0)
                scale(0.95);
        }

        /* =========================================
           MOUSE LIGHT
        ========================================= */

        #mouse-light {
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            pointer-events: none;

            z-index: -2;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.045) 0%,
                    rgba(255,255,255,0.018) 30%,
                    transparent 70%
                );

            filter: blur(8px);
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {
            .navbar {
                top: 10px;
                height: 62px;
                border-radius: 17px;
            }

            .logo-text {
                display: none;
            }

            .navbar-right {
                gap: 2px;
            }

            .navbar-right a {
                width: 38px;
                height: 38px;
            }

            .content {
                padding-top: 180px;
            }

            .content h1 {
                letter-spacing: -2px;
            }

            .content > p {
                margin-bottom: 30px;
            }

            #uv-address {
                height: 61px;
                border-radius: 18px;
            }
        }
    </style>

<body class="index-page">

    <!-- Background particles -->
    <div id="particles"></div>

    <!-- Cursor light -->
    <div id="mouse-light"></div>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <h5 id="loading-text">
            Loading, please wait...
        </h5>
    </div>

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="navbar-left">
            <img
                src="png/logo.svg"
                alt="Truffled Logo"
                class="logo"
            >

            <span class="logo-text">
                Truffled
            </span>
        </div>

        <div class="navbar-right">

            <a href="index.html" title="Home">
                <img
                    src="png/house-solid.svg"
                    alt="Home"
                >
            </a>

            <a href="games.html" title="Games">
                <img
                    src="png/gamepad-solid.svg"
                    alt="Games"
                >
            </a>

            <a href="settings.html" title="Settings">
                <img
                    src="png/gear-solid.svg"
                    alt="Settings"
                >
            </a>

        </div>
    </div>


    <!-- MAIN -->
    <div class="content">

        <h1>
            Search the web
        </h1>

        <p>
            Browse the web through Truffled
        </p>


        <!-- UV SEARCH -->
        <form id="uv-form">

            <input
                id="uv-search-engine"
                value="https://www.google.com/search?q=%s"
                type="hidden"
            >

            <input
                id="uv-address"
                type="text"
                placeholder="Search the web..."
                class="search-bar"
                autocomplete="off"
            >

        </form>


        <div class="desc left-margin">

            <p id="uv-error"></p>

            <pre id="uv-error-code"></pre>

        </div>


        <div class="button-container"></div>


        <div>
            <button
                class="button"
                onclick="openIframe()"
            >
                Cloaker
            </button>

            <button
                class="sigma"
                onclick="window.open('https://discord.gg/MgAVPggThx', '_blank')"
            >
                Discord
            </button>
        </div>

    </div>


    <!-- UV -->
    <script src="/static/uv/uv.bundle.js" defer></script>
    <script src="/static/uv/uv.config.js" defer></script>
    <script src="/static/register-sw.js" defer></script>
    <script src="/static/search.js" defer></script>
    <script src="/static/index.js" defer></script>

    <!-- Existing loading script -->
    <script src="/loading.js"></script>


    <!-- CLOAKER -->
    <script>
        function openIframe() {

            const newWindow = window.open("about:blank");

            if (!newWindow) {
                return;
            }

            newWindow.document.title = "Loading...";

            const iframe =
                newWindow.document.createElement("iframe");

            iframe.src = "/";

            iframe.style.position = "fixed";
            iframe.style.inset = "0";
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";

            newWindow.document.body.style.margin = "0";
            newWindow.document.body.style.background = "#000";

            newWindow.document.body.appendChild(iframe);
        }
    </script>


    <!-- PARTICLES -->
    <script>
        const particleContainer =
            document.getElementById("particles");

        const particleCount =
            window.innerWidth < 700 ? 35 : 65;

        for (let i = 0; i < particleCount; i++) {

            const particle =
                document.createElement("div");

            particle.classList.add("particle");

            const sizeType = Math.random();

            if (sizeType < 0.25) {
                particle.classList.add("small");
            }

            if (sizeType > 0.85) {
                particle.classList.add("large");
            }

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.animationDuration =
                (8 + Math.random() * 18) + "s";

            particle.style.animationDelay =
                (-Math.random() * 20) + "s";

            particle.style.opacity =
                0.25 + Math.random() * 0.7;

            particle.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            particleContainer.appendChild(particle);
        }
    </script>


    <!-- CURSOR LIGHT -->
    <script>
        const mouseLight =
            document.getElementById("mouse-light");

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let lightX = mouseX;
        let lightY = mouseY;

        document.addEventListener("mousemove", (event) => {

            mouseX = event.clientX;
            mouseY = event.clientY;

        });

        function animateLight() {

            lightX += (mouseX - lightX) * 0.08;
            lightY += (mouseY - lightY) * 0.08;

            mouseLight.style.left =
                lightX + "px";

            mouseLight.style.top =
                lightY + "px";

            requestAnimationFrame(animateLight);
        }

        animateLight();
    </script>


    <!-- CLICK RIPPLE -->
    <script>
        document.addEventListener("click", (event) => {

            const ripple =
                document.createElement("div");

            ripple.style.position = "fixed";
            ripple.style.left = event.clientX + "px";
            ripple.style.top = event.clientY + "px";

            ripple.style.width = "10px";
            ripple.style.height = "10px";

            ripple.style.border =
                "1px solid rgba(255,255,255,0.5)";

            ripple.style.borderRadius = "50%";

            ripple.style.pointerEvents = "none";

            ripple.style.zIndex = "99998";

            ripple.style.transform =
                "translate(-50%, -50%)";

            ripple.style.animation =
                "clickRipple 0.7s ease-out forwards";

            document.body.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();

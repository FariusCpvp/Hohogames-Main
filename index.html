<style> /* ========================================================= FARIUS BLACK / WHITE ========================================================= */ * { box-sizing: border-box; margin: 0; padding: 0; } html, body { width: 100%; min-height: 100%; } body { min-height: 100vh; overflow-x: hidden; font-family: "Poppins", sans-serif; color: #fff; background: radial-gradient( circle at 50% 20%, rgba(255,255,255,.075), transparent 32% ), radial-gradient( circle at 10% 90%, rgba(255,255,255,.035), transparent 30% ), #050505; } /* subtle background grid */ body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient( rgba(255,255,255,.018) 1px, transparent 1px ), linear-gradient( 90deg, rgba(255,255,255,.018) 1px, transparent 1px ); background-size: 65px 65px; mask-image: radial-gradient( circle at center, black, transparent 82% ); z-index: -5; } body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient( circle at center, transparent 35%, rgba(0,0,0,.6) 100% ); z-index: -4; } /* ========================================================= PARTICLES ========================================================= */ #particles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; opacity: .55; } .particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.5); animation: particleFloat linear infinite; } .particle.small { width: 2px; height: 2px; } .particle.large { width: 5px; height: 5px; } @keyframes particleFloat { 0% { transform: translate3d(0,110vh,0); opacity: 0; } 10% { opacity: .7; } 50% { transform: translate3d(30px,50vh,0); opacity: .45; } 90% { opacity: .2; } 100% { transform: translate3d(-25px,-15vh,0); opacity: 0; } } /* ========================================================= LOADING ========================================================= */ #loading-screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; z-index: 99999; transition: opacity .7s ease, visibility .7s ease; } #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; } .dots { display: flex; gap: 9px; margin-bottom: 18px; } .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: loadingBounce .85s infinite ease-in-out; } .dot:nth-child(2) { animation-delay: .13s; } .dot:nth-child(3) { animation-delay: .26s; } @keyframes loadingBounce { 0%, 100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-11px); opacity: 1; } } #loading-text { color: #777; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; } /* ========================================================= OLD NAVBAR HIDDEN ========================================================= */ .navbar { display: none !important; } /* ========================================================= FARIUS BRAND ========================================================= */ .site-brand { position: fixed; top: 31px; left: 50%; transform: translateX(-50%); z-index: 950; display: flex; flex-direction: column; align-items: center; color: #fff; font-size: clamp(2.1rem, 5vw, 3.5rem); line-height: 1; font-weight: 800; letter-spacing: -.08em; user-select: none; text-shadow: 0 0 35px rgba(255,255,255,.12); animation: brandIn .7s cubic-bezier(.2,.8,.2,1); } .site-brand small { margin-top: 9px; color: #777; font-size: 9px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; text-shadow: none; } @keyframes brandIn { from { opacity: 0; transform: translate(-50%,-20px) scale(.95); } to { opacity: 1; transform: translate(-50%,0) scale(1); } } /* ========================================================= RIGHT NAVIGATION ========================================================= */ .side-panel { position: fixed; top: 50%; right: 25px; transform: translateY(-50%); z-index: 900; display: flex; flex-direction: column; gap: 7px; padding: 8px; background: rgba(12,12,12,.82); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: navIn .7s cubic-bezier(.2,.8,.2,1); } @keyframes navIn { from { opacity: 0; transform: translateY(-50%) translateX(25px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } } .side-panel a { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 13px; border: 1px solid transparent; transition: background .2s ease, border-color .2s ease, transform .2s ease; } .side-panel a:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.2); transform: translateX(-3px); } .side-panel a:active { transform: scale(.92); } .side-panel a[aria-current="page"] { background: #fff; border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,.15); } .side-panel img { width: 19px; height: 19px; filter: brightness(0) invert(1); opacity: .65; transition: opacity .2s ease, transform .2s ease; } .side-panel a:hover img { opacity: 1; transform: scale(1.08); } .side-panel a[aria-current="page"] img { filter: brightness(0); opacity: 1; } /* ========================================================= MAIN CONTENT ========================================================= */ .content { width: min(760px, calc(100% - 40px)); min-height: 100vh; margin: 0 auto; padding-top: 225px; display: flex; flex-direction: column; align-items: center; text-align: center; animation: contentIn .8s .12s both cubic-bezier(.2,.8,.2,1); } @keyframes contentIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } } /* ========================================================= TITLE ========================================================= */ .content h1 { margin-bottom: 14px; color: #fff; background: none; -webkit-text-fill-color: #fff; font-size: clamp(2.7rem, 7vw, 5rem); line-height: .95; font-weight: 800; letter-spacing: -.075em; text-shadow: 0 5px 35px rgba(0,0,0,.65); } .content > p { margin-bottom: 10px; color: #999; font-size: 14px; letter-spacing: .025em; } .content .credit { margin-bottom: 34px; color: #555; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; } /* ========================================================= SEARCH ========================================================= */ #uv-form { position: relative; width: 100%; animation: searchIn .8s .3s both cubic-bezier(.2,.8,.2,1); } @keyframes searchIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } } #uv-address { width: 100%; height: 66px; padding: 0 25px; outline: none; border: 1px solid rgba(255,255,255,.13); border-radius: 17px; background: rgba(12,12,12,.84); color: #fff; font-family: inherit; font-size: 14px; box-shadow: 0 20px 55px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.035); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: border-color .25s ease, background .25s ease, box-shadow .25s ease, transform .25s ease; } #uv-address::placeholder { color: #666; } #uv-address:hover { background: rgba(18,18,18,.9); border-color: rgba(255,255,255,.22); } #uv-address:focus { background: rgba(15,15,15,.95); border-color: rgba(255,255,255,.4); transform: translateY(-2px); box-shadow: 0 25px 70px rgba(0,0,0,.58), 0 0 0 4px rgba(255,255,255,.045); } /* animated light across search */ #uv-form::before { content: ""; position: absolute; top: 1px; left: -120%; width: 42%; height: 64px; border-radius: 17px; pointer-events: none; background: linear-gradient( 90deg, transparent, rgba(255,255,255,.07), transparent ); animation: searchShine 6s infinite; } @keyframes searchShine { 0% { left: -120%; } 25%, 100% { left: 130%; } } /* ========================================================= ERROR ========================================================= */ .desc { width: 100%; margin-top: 12px; text-align: left; } #uv-error { color: #ff7070; font-size: 12px; } #uv-error-code { color: #666; font-size: 10px; white-space: pre-wrap; } /* ========================================================= BUTTONS ========================================================= */ .button-container { height: 10px; } .button, .sigma { margin: 5px; padding: 10px 19px; border: 1px solid rgba(255,255,255,.12); border-radius: 11px; background: rgba(15,15,15,.85); color: #fff; font-family: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: background .2s ease, border-color .2s ease, transform .2s ease; } .button:hover, .sigma:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); transform: translateY(-2px); } .button:active, .sigma:active { transform: scale(.96); } /* ========================================================= SCROLLBAR ========================================================= */ ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #050505; } ::-webkit-scrollbar-thumb { background: #292929; border-radius: 20px; } ::-webkit-scrollbar-thumb:hover { background: #444; } ::selection { background: #fff; color: #000; } /* ========================================================= MOBILE ========================================================= */ @media (max-width: 650px) { .site-brand { top: 22px; font-size: clamp(2rem, 11vw, 2.8rem); } .site-brand small { font-size: 8px; } .content { width: calc(100% - 32px); padding-top: 155px; } .content h1 { font-size: clamp(2.5rem, 12vw, 4rem); } .content > p { font-size: 13px; } #uv-address { height: 60px; border-radius: 15px; } .side-panel { top: auto; bottom: 14px; right: 50%; transform: translateX(50%); flex-direction: row; border-radius: 15px; } .side-panel a:hover { transform: translateY(-2px); } } /* ========================================================= REDUCED MOTION ========================================================= */ @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } } </style>
